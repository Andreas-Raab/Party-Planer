<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party-Planer</title>
<style>
  :root {
    --bg: #fdf8f0;
    --card: #fffdf9;
    --border: #e8d7bd;
    --text: #4a2c12;
    --text-muted: #9c7a52;
    --accent: #a7591c;
    --accent-2: #c97b2e;
    --accent-bg: #f3e4cb;
    --berry: #983c0d;
    --pine: #748b30;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(80, 45, 10, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #fbefdb 0%, var(--bg) 220px);
    color: var(--text);
    line-height: 1.5;
  }
  .festive-bar {
    height: 5px;
    background: linear-gradient(90deg, var(--accent), var(--berry), var(--pine), var(--accent-2), var(--accent));
    background-size: 300% 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 18px 70px; }
  .header { text-align: center; margin-bottom: 26px; }
  .header .hero-image {
    width: 150px;
    height: 150px;
    object-fit: contain;
    background: #fff;
    border-radius: 50%;
    box-shadow: var(--shadow);
    border: 4px solid #fff;
    outline: 3px dashed var(--accent-2);
    outline-offset: 4px;
    padding: 6px;
  }
  h1 { font-size: 24px; font-weight: 700; margin: 12px 0 4px; }
  .subtitle { color: var(--text-muted); font-size: 14px; }
  .countdown { display: inline-flex; gap: 18px; margin-top: 22px; }
  .countdown .ornament-wrap { text-align: center; }
  .countdown .ribbon { width: 4px; height: 10px; margin: 0 auto; border-radius: 1px; }
  .countdown .ornament {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.18), 0 3px 8px rgba(60,40,10,0.12);
  }
  .countdown .ornament .num { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.1; }
  .countdown .ornament .lbl { font-size: 8px; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px; }
  .countdown.done { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text);
  }
  .card h2 .count-pill {
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    text-transform: none;
    letter-spacing: normal;
  }

  input[type=text] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: #fffdfb;
    transition: border-color 0.15s;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .food-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .food-row input { flex: 1; }
  .food-row button {
    padding: 11px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    font-size: 18px;
    white-space: nowrap;
    line-height: 1;
  }
  .food-row button:hover { background: #8a4616; }
  .error { color: #b13c3c; font-size: 13px; margin-top: -10px; margin-bottom: 14px; display: none; }

  .food-pill-list { display: flex; flex-direction: column; gap: 8px; }
  .food-pill {
    position: relative;
    overflow: visible;
    background: var(--accent-bg);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .food-pill .row-actions { display: flex; gap: 2px; opacity: 0.45; flex-shrink: 0; }
  .food-pill:hover .row-actions { opacity: 1; }
  .food-pill .row-actions button {
    background: rgba(255,255,255,0.6);
    border: none;
    cursor: pointer;
    font-size: 13px;
    padding: 5px 7px;
    border-radius: 6px;
  }
  .food-pill .row-actions button:hover { background: #fff; }
  @keyframes popIn {
    0%   { transform: scale(0.9); background: #e8b35e; box-shadow: 0 0 0 0 rgba(152,60,13,0.35); }
    25%  { transform: scale(1.04); background: #d98f6a; box-shadow: 0 0 0 6px rgba(152,60,13,0.18); }
    50%  { transform: scale(1.01); background: #b7c285; box-shadow: 0 0 0 10px rgba(116,139,48,0.12); }
    75%  { transform: scale(1.015); background: #e8b35e; box-shadow: 0 0 0 6px rgba(167,89,28,0.14); }
    100% { transform: scale(1); background: var(--accent-bg); box-shadow: 0 0 0 0 rgba(167,89,28,0); }
  }
  .food-pill.new-entry { animation: popIn 1.8s ease-out; }

  .sparkle {
    position: absolute;
    top: 50%;
    left: 50%;
    font-size: 16px;
    pointer-events: none;
    opacity: 0;
    animation: sparkleFloat 1.3s ease-out forwards;
  }
  @keyframes sparkleFloat {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4) translateY(0); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1) translateY(-4px); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1) translateY(var(--rise, -42px)) translateX(var(--drift, 0px)); }
  }

  .empty { color: var(--text-muted); font-size: 13px; padding: 6px 0; }
  .loading-screen { text-align: center; color: var(--text-muted); padding: 80px 0; font-size: 14px; }
  .loading-screen .spinner-big {
    width: 28px; height: 28px;
    border: 3px solid var(--accent-2);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="festive-bar"></div>
<div class="wrap">
  <div class="header">
    <img src="gingerbread-50.jpg" alt="50" class="hero-image">
    <h1 id="party-title">Party-Planer</h1>
    <div class="subtitle">Trag ein, was du zum Buffet mitbringst.</div>
    <div class="countdown" id="countdown"></div>
  </div>

  <div id="loading" class="loading-screen">
    <div class="spinner-big"></div>
    Lade Daten …
  </div>

  <div id="content" style="display:none;">
    <div class="card">
      <h2 id="food-list-heading">Beitrag zum Buffet <span class="count-pill" id="food-count">0</span></h2>
      <div class="food-row">
        <input type="text" id="food-item" placeholder="z. B. Kartoffelsalat">
        <button id="food-add">+</button>
      </div>
      <div class="error" id="food-error">Bitte etwas eingeben.</div>
      <div class="food-pill-list" id="food-list"><div class="empty">Noch nichts eingetragen.</div></div>
    </div>
  </div>
</div>

<script>
const foodItemInput = document.getElementById('food-item');
const foodAddBtn = document.getElementById('food-add');
const foodError = document.getElementById('food-error');
const foodList = document.getElementById('food-list');
const loadingEl = document.getElementById('loading');
const contentEl = document.getElementById('content');

let foods = [];     // [{ id, item, icon }]
let editingFoodId = null;
let knownFoodIds = new Set();

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ---- Countdown & Überschrift ----
const PARTY_DATE = '2026-12-19T19:00:00'; // 50. Geburtstag, 19.12.2026, 19 Uhr
const MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function setFoodHeading() {
  const heading = document.getElementById('food-list-heading');
  if (!PARTY_DATE) { heading.innerHTML = `Beitrag zum Buffet <span class="count-pill" id="food-count">0</span>`; return; }
  const d = new Date(PARTY_DATE);
  const dateStr = `${d.getDate()}. ${MONTHS_DE[d.getMonth()]}`;
  heading.innerHTML = `Beitrag zum Buffet am ${dateStr} <span class="count-pill" id="food-count">0</span>`;
}
setFoodHeading();

function renderCountdown() {
  const el = document.getElementById('countdown');
  if (!PARTY_DATE) { el.style.display = 'none'; return; }
  const target = new Date(PARTY_DATE).getTime();
  const diff = target - Date.now();

  if (diff <= 0) {
    el.className = 'countdown done';
    el.textContent = '🎉 Die Feier läuft schon!';
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);

  el.className = 'countdown';
  el.innerHTML = `
    <div class="ornament-wrap">
      <div class="ribbon" style="background:#8a6a3a;"></div>
      <div class="ornament" style="background: radial-gradient(circle at 35% 30%, #c97b2e, #a7591c);">
        <span class="num">${days}</span><span class="lbl">Tage</span>
      </div>
    </div>
    <div class="ornament-wrap">
      <div class="ribbon" style="background:#5c6e28;"></div>
      <div class="ornament" style="background: radial-gradient(circle at 35% 30%, #93a858, #748b30);">
        <span class="num">${hours}</span><span class="lbl">Std</span>
      </div>
    </div>
    <div class="ornament-wrap">
      <div class="ribbon" style="background:#7a2f0a;"></div>
      <div class="ornament" style="background: radial-gradient(circle at 35% 30%, #c25a28, #983c0d);">
        <span class="num">${minutes}</span><span class="lbl">Min</span>
      </div>
    </div>
  `;
}
renderCountdown();
setInterval(renderCountdown, 60000);

// ---- Icons ----
const ICON_RULES = [
  [/pizza/i, '🍕'], [/salat/i, '🥗'], [/kuchen|torte|cake/i, '🍰'],
  [/pasta|nudel|spaghetti|lasagne/i, '🍝'], [/brot|baguette/i, '🍞'],
  [/käse|kaese/i, '🧀'], [/wurst|grill|bbq|steak|fleisch/i, '🍖'],
  [/hähnchen|huhn|chicken/i, '🍗'], [/fisch|lachs|sushi/i, '🍣'],
  [/suppe/i, '🍲'], [/dip|guacamole/i, '🥑'], [/chips|snack|flips|erdnussflips/i, '🍿'],
  [/keks|cookie/i, '🍪'], [/muffin|cupcake/i, '🧁'], [/donut|krapfen/i, '🍩'],
  [/melone/i, '🍉'], [/erdbeer/i, '🍓'], [/apfel/i, '🍎'], [/traube/i, '🍇'],
  [/banane/i, '🍌'], [/obstsalat|obst|frucht/i, '🍓'],
  [/wein/i, '🍷'], [/sekt|prosecco|champagner/i, '🥂'],
  [/bier/i, '🍺'], [/cocktail/i, '🍹'],
  [/wasser/i, '💧'], [/getränk|saft|drink|limo|softdrink/i, '🥤'],
  [/kaffee/i, '☕'], [/tee\b/i, '🍵'], [/eis(?!en)/i, '🍨'],
  [/schokolade|schoko/i, '🍫'], [/reis/i, '🍚'], [/wrap|burrito|taco/i, '🌯'],
  [/burger/i, '🍔'], [/hotdog/i, '🌭'], [/pommes|fries/i, '🍟'],
  [/ei(er)?\b/i, '🥚'], [/gemüse|gemuese|rohkost/i, '🥕'],
  [/kartoffel/i, '🥔'], [/mais/i, '🌽'], [/oliven?/i, '🫒'],
  [/quiche|tarte/i, '🥧'], [/sandwich|belegtes brot|canap/i, '🥪'],
  [/hummus/i, '🧆'], [/tapas|antipasti/i, '🍢'], [/kebap|kebab|döner/i, '🥙'],
  [/curry/i, '🍛'], [/dessert|nachtisch|nachspeise/i, '🍮'],
  [/nuss|nüsse|erdnuss|mandel|cashew/i, '🥜'], [/waffel/i, '🧇'],
  [/pfannkuchen|crêpe|crepe/i, '🥞'], [/marshmallow/i, '🍡'],
  [/lolli|bonbon|süßigkeit|sweets|gummibär/i, '🍬'],
];

function iconFor(itemName) {
  for (const [pattern, icon] of ICON_RULES) {
    if (pattern.test(itemName)) return icon;
  }
  return '🍽️';
}

// ---- Speicher (jsonbin.io) ----
const JSONBIN_ID = '6aa6a1f8ffd5d16053016fc5';
const JSONBIN_KEY = '$2a$10$dOxzKDOFJPtLBoEVDlqdI.o5DkLIpwYRl8sTiewUIq3h/xKYraWuW';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

async function loadData(isPoll) {
  try {
    const response = await fetch(`${JSONBIN_URL}/latest`, {
      headers: { 'X-Access-Key': JSONBIN_KEY }
    });
    if (!response.ok) throw new Error('Laden fehlgeschlagen');
    const data = await response.json();
    const record = data.record || {};
    const newFoods = record.foods || [];
    newFoods.forEach(f => { if (!f.id) f.id = makeId(); });

    if (isPoll) {
      const newlyAdded = newFoods.map(f => f.id).filter(id => !knownFoodIds.has(id));
      foods = newFoods;
      foods.forEach(f => knownFoodIds.add(f.id));
      render();
      if (newlyAdded.length) flashNewFoodEntries(newlyAdded);
      return;
    }

    foods = newFoods;
    foods.forEach(f => knownFoodIds.add(f.id));
  } catch (e) {
    console.error('Daten konnten nicht geladen werden', e);
    if (!isPoll) foods = [];
  }

  render();
  loadingEl.style.display = 'none';
  contentEl.style.display = 'block';
}

async function saveData() {
  try {
    await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Access-Key': JSONBIN_KEY },
      body: JSON.stringify({ foods })
    });
  } catch (e) {
    console.error('Speichern fehlgeschlagen', e);
  }
}

setInterval(() => loadData(true), 15000);

// ---- Essen hinzufügen / bearbeiten / löschen ----
function startEditFood(id) {
  const entry = foods.find(f => f.id === id);
  if (!entry) return;
  editingFoodId = id;
  foodItemInput.value = entry.item;
  foodItemInput.focus();
  foodAddBtn.textContent = '✓';
  foodAddBtn.title = 'Änderung speichern';
}

async function removeFood(id) {
  if (!confirm('Diesen Eintrag wirklich löschen?')) return;
  foods = foods.filter(f => f.id !== id);
  if (editingFoodId === id) {
    editingFoodId = null;
    foodItemInput.value = '';
    foodAddBtn.textContent = '+';
  }
  await saveData();
  render();
}

foodAddBtn.addEventListener('click', async () => {
  const item = foodItemInput.value.trim();
  if (!item) { foodError.style.display = 'block'; return; }
  foodError.style.display = 'none';

  if (editingFoodId) {
    const entry = foods.find(f => f.id === editingFoodId);
    if (entry) { entry.item = item; entry.icon = iconFor(item); }
    editingFoodId = null;
    foodAddBtn.textContent = '+';
    foodAddBtn.title = '';
    foodItemInput.value = '';
    await saveData();
    render();
  } else {
    const newEntry = { id: makeId(), item, icon: iconFor(item) };
    foods.push(newEntry);
    knownFoodIds.add(newEntry.id);
    foodItemInput.value = '';
    await saveData();
    render();
    flashNewFoodEntries([newEntry.id]);
  }
});

foodItemInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') foodAddBtn.click(); });
foodItemInput.addEventListener('input', () => { foodError.style.display = 'none'; });

function render() {
  const foodCountEl = document.getElementById('food-count');
  if (foodCountEl) foodCountEl.textContent = foods.length;

  if (foods.length === 0) {
    foodList.innerHTML = '<div class="empty">Noch nichts eingetragen.</div>';
  } else {
    foodList.innerHTML = foods.map(f => `<div class="food-pill" data-food-id="${f.id}">
      <span class="label">${escapeHtml(f.item)}</span>
      <div class="row-actions">
        <button onclick="startEditFood('${f.id}')" title="Bearbeiten">✏️</button>
        <button onclick="removeFood('${f.id}')" title="Löschen">🗑️</button>
      </div>
    </div>`).join('');
  }
}

const SPARKLE_SYMBOLS = ['🎉', '✨', '❄️', '🎂'];

function spawnSparkles(el) {
  const count = 5;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.textContent = SPARKLE_SYMBOLS[Math.floor(Math.random() * SPARKLE_SYMBOLS.length)];
    const drift = Math.round((Math.random() - 0.5) * 70); // -35px..35px
    const rise = -36 - Math.round(Math.random() * 24); // -36..-60px
    const leftOffset = (Math.random() - 0.5) * 60;
    s.style.left = `calc(50% + ${leftOffset}px)`;
    s.style.setProperty('--drift', `${drift}px`);
    s.style.setProperty('--rise', `${rise}px`);
    s.style.animationDelay = `${i * 70}ms`;
    el.appendChild(s);
    setTimeout(() => s.remove(), 1600);
  }
}

function flashNewFoodEntries(ids) {
  ids.forEach(id => {
    const el = foodList.querySelector(`[data-food-id="${id}"]`);
    if (el) {
      el.classList.add('new-entry');
      spawnSparkles(el);
      setTimeout(() => el.classList.remove('new-entry'), 1800);
    }
  });
}

loadData();
</script>
</body>
</html>
